name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible benchmark smoke
        run: |
          python -m jev gate examples/proposal.json --policy examples/policy.json
          python -m jev eval examples/suite.json --output results.json
          python -m jev compare examples/reference-results.json results.json
      - name: Adversarial fixture must fail the regression gate
        run: |
          if python -m jev eval examples/adversarial-suite.json; then
            echo "Unsafe trajectory unexpectedly passed" >&2
            exit 1
          fi
