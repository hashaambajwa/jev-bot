[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-agent-contracts"
version = "0.1.0"
description = "Deterministic decision contracts and evaluation gates for AI agent trajectories"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hashaam Bajwa"}]
keywords = ["agent", "evals", "llm", "observability", "policy", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
jev = "jev.__main__:main"

[tool.setuptools.packages.find]
include = ["jev*"]
